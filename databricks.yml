bundle:
  name: genie-trace-monitoring

include:
  - resources/*.yml
  # Optional, gitignored: put your own profile / warehouse / target overrides here.
  # See databricks.local.yml.example.
  - "*.local.yml"

variables:
  # Where the Genie trace monitoring tables are created.
  catalog:
    description: Catalog for the genie_tracing schema and all derived tables.
    default: unity_gateway
  schema:
    description: Schema for all derived tables, views, volumes and detections.
    default: genie_tracing

  # The Unity Gateway unified trace table that Genie One / Genie Code write to.
  source_table:
    description: Fully qualified name of the unified trace (OTel spans) table.
    default: unity_gateway.unified_tracing.unity_gateway_otel_spans
  annotations_table:
    description: Fully qualified name of the unified trace annotations table (thumbs up/down).
    default: unity_gateway.unified_tracing.unity_gateway_otel_annotations

  # service_name values used by Genie products in the trace table. Genie One appears under more
  # than one: `Genie One` for the web / desktop app, `data-rooms` for API and CLI conversations.
  genie_one_services:
    description: Comma-separated service_name values for Genie One spans.
    default: Genie One,data-rooms
  genie_code_service:
    default: genie-code-agent

  # Model serving endpoint hosting Llama Prompt Guard 2 (deployed by 01_deploy_prompt_guard).
  prompt_guard_endpoint:
    default: genie-prompt-guard-2

  # How 01_deploy_prompt_guard gets the model weights (run by the genie_tracing_setup job):
  # `huggingface` needs a secret with a Hugging Face token that has Meta Llama access;
  # `uc_model` copies them from a Prompt Guard 2 model already registered in Unity Catalog.
  prompt_guard_model_source:
    default: huggingface
  prompt_guard_source_uc_model:
    description: Registered model to copy weights from when prompt_guard_model_source = uc_model.
    default: main.default.llama_prompt_guard_2
  hf_secret_scope:
    default: genie_tracing
  hf_secret_key:
    default: hf_token

  # PII allowlist: YAML files of terms 02_detect_pii never treats as PII (see src/config/).
  pii_allowlist_files:
    description: >
      Comma-separated workspace paths of allowlist YAML files, merged in order. Add
      src/config/pii_allowlist_security.yml for SOC / security workloads, or your own file.
    default: ${workspace.file_path}/src/config/pii_allowlist.yml

  # Deterministic security signatures and bounded decoding / runaway thresholds.
  security_patterns_file:
    description: Workspace path of the security-pattern YAML used by the guardrail detector.
    default: ${workspace.file_path}/src/config/security_patterns.yml

  # Volume used to stage wheels (spaCy model for Presidio).
  libs_volume:
    default: genie_tracing_libs

  # How far back each detection run looks for un-scanned spans.
  detection_lookback_days:
    default: "7"

  # SQL warehouse used by alerts, resolved by name at deploy time.
  warehouse_name:
    description: >
      Name of an existing serverless or pro SQL warehouse to run the alert on. The lookup fails at
      deploy time if no warehouse has this exact name, so set it per workspace.
    default: Serverless Starter Warehouse
  warehouse_id:
    description: SQL warehouse ID for alerts (looked up from warehouse_name).
    lookup:
      warehouse: ${var.warehouse_name}

  # Schedules are paused by default so a fresh deployment does not start billing.
  schedule_pause_status:
    default: PAUSED

  alert_email:
    description: Email address that receives alert notifications.
    default: ${workspace.current_user.userName}

  alert_lookback_hours:
    description: >
      How many hours of flagged sessions each alert notification lists. Alerts only trigger when a
      session got a new finding since the previous (hourly) job run; older rows are context.
    default: "24"

  workspace_url:
    description: >
      Base URL of the workspace (https://...), used for the table links in alert notifications.
      Defaults to workspace.host, which is empty when the host comes only from a CLI profile; set it
      in databricks.local.yml or with --var in that case.
    default: ${workspace.host}

# Targets deliberately carry no workspace host or profile: pass `--profile <name>` on the CLI,
# or add a gitignored databricks.local.yml (see databricks.local.yml.example).
targets:
  dev:
    default: true
    # No `mode: development` on purpose: it would prefix the schema name (dev_<user>_genie_tracing)
    # and the volume path baked into the job environment. Schedules are paused via variables instead.

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schedule_pause_status: UNPAUSED
    run_as:
      user_name: ${workspace.current_user.userName}
