resources:
  pipelines:
    genie_tracing_etl:
      name: "[${bundle.target}] genie_tracing_etl"
      catalog: ${var.catalog}
      schema: ${resources.schemas.genie_tracing.name}
      serverless: true
      continuous: false
      channel: CURRENT
      photon: true

      root_path: ../src/pipelines/etl
      libraries:
        - glob:
            include: ../src/pipelines/etl/transformations/**

      configuration:
        source_table: ${var.source_table}
        genie_one_service: ${var.genie_one_service}
        genie_code_service: ${var.genie_code_service}
