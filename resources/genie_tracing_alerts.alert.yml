# SQL Alert (v2): one digest of Genie sessions to review, covering PII, prompt injection and
# guardrail signals together, with how bad each session is.
#
# Evaluated by the alert_sessions_to_review task at the end of the genie_tracing_monitoring job, after
# genie_sessions has been rebuilt, so it never reads a half-refreshed table. Its own schedule stays
# paused; it exists only because an alert needs one.
#
# The query returns one row per session flagged in the last ${var.alert_lookback_hours} hours
# (default 24), rendered in the notification via @QUERY_RESULT_TABLE. `is_new` = 1 when the session
# got a finding since the previous job run. Rows are sorted is_new DESC and the alert triggers when
# the first row's is_new > 0, so it notifies only when something new arrived; older rows give
# context. No aggregation on purpose: an aggregation collapses @QUERY_RESULT_TABLE to one value.
# retrigger_seconds = 1 sends a notification on every run that triggers.
#
# "New" means the last 1 hour, matching the job's hourly cron: change both together.
#
# Notifications carry identifiers, labels and scores only, never prompt / response text: alert
# emails and Slack messages sit outside the access controls in src/sql/access_control.sql.
resources:
  alerts:
    genie_sessions_to_review:
      display_name: "[${bundle.target}] Genie: sessions to review"
      warehouse_id: ${var.warehouse_id}
      query_text: |
        SELECT severity,
               round(risk_score, 2)                                      AS risk_score,
               CASE WHEN flags.last_flagged_at >= current_timestamp() - INTERVAL 1 HOUR THEN 1 ELSE 0 END AS is_new,
               conversation_id,
               product,
               workspace_id,
               requester,
               coalesce(CAST(round(risk.max_pii_score, 2) AS STRING), '')                              AS pii,
               coalesce(CAST(round(risk.max_prompt_injection_score, 2) AS STRING), '')                 AS injection,
               coalesce(CAST(round(risk.max_guardrail_score, 2) AS STRING), '')                        AS guardrail,
               array_join(array_sort(array_union(flags.flag_labels, flags.pii_entity_types)), ', ') AS labels,
               date_format(flags.first_flagged_at, 'yyyy-MM-dd HH:mm')   AS first_flagged_utc,
               date_format(flags.last_flagged_at, 'yyyy-MM-dd HH:mm')    AS last_flagged_utc
        FROM ${var.catalog}.${var.schema}.genie_sessions
        WHERE is_flagged
          AND flags.last_flagged_at >= current_timestamp() - INTERVAL ${var.alert_lookback_hours} HOURS
        ORDER BY is_new DESC, risk_score DESC, flags.last_flagged_at DESC
      custom_template_format: MARKDOWN
      custom_summary: "[${bundle.target}] Genie: sessions to review"
      custom_description: |
        **@ALERT_NAME** is @ALERT_STATUS. Sessions with a new finding since the last run
        (`is_new` = 1), then every session flagged in the last ${var.alert_lookback_hours} hours for
        context.

        `severity` is from `risk_score`: high >= 0.8, medium >= 0.5, otherwise low. `pii`,
        `injection` and `guardrail` are the highest score per category (blank = nothing found);
        PII is weighted by entity type, so a card number scores far above a name.

        @QUERY_RESULT_TABLE

        **Investigate:** start from the session row in
        [genie_sessions](${var.workspace_url}/explore/data/${var.catalog}/${var.schema}/genie_sessions)
        (the `risk` struct shows what drove the score), then walk it step by step in
        [genie_session_timeline](${var.workspace_url}/explore/data/${var.catalog}/${var.schema}/genie_session_timeline):

        `SELECT * FROM ${var.catalog}.${var.schema}.genie_session_timeline WHERE conversation_id = '<conversation_id>' ORDER BY step_number`

        The evidence for each flag (entity types and offsets, prompt-injection scores, matched
        guardrail wording) is in
        [genie_detections](${var.workspace_url}/explore/data/${var.catalog}/${var.schema}/genie_detections).
        Alert: @ALERT_URL
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: is_new
          display: is_new
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: false
          retrigger_seconds: 1
          subscriptions:
            - user_email: ${var.alert_email}
      schedule:
        pause_status: PAUSED # evaluated by the job's alert_sessions_to_review task
        quartz_cron_schedule: "0 45 * * * ?"
        timezone_id: UTC
