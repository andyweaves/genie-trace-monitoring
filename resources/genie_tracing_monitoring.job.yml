resources:
  jobs:
    genie_tracing_monitoring:
      name: "[${bundle.target}] genie_tracing_monitoring"
      description: >
        Flattens Genie One / Genie Code traces, runs PII, prompt-injection and guardrail-signal
        detections, rebuilds the session rollups, then evaluates the "sessions to review" SQL alert
        against the finished tables.

      schedule:
        quartz_cron_expression: "0 15 * * * ?" # hourly at :15
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.genie_tracing.name}
        - name: libs_volume
          default: ${var.libs_volume}
        - name: prompt_guard_endpoint
          default: ${var.prompt_guard_endpoint}
        - name: lookback_days
          default: ${var.detection_lookback_days}
        - name: pii_allowlist_files
          default: ${var.pii_allowlist_files}

      environments:
        # PII task only: Presidio + spaCy and the model wheel staged by 00_setup. Kept separate so a
        # missing wheel fails detect_pii without blocking the other detectors.
        - environment_key: detections
          spec:
            environment_version: "4"
            dependencies:
              - presidio-analyzer>=2.2,<3
              - presidio-anonymizer>=2.2,<3
              - spacy>=3.8,<3.9
              - pyyaml>=6
              # spaCy English model staged in the libs volume by 00_setup.
              - /Volumes/${var.catalog}/${var.schema}/${var.libs_volume}/wheels/en_core_web_md-3.8.0-py3-none-any.whl
        # Prompt-injection and guardrail tasks: no extra libraries needed.
        - environment_key: base
          spec:
            environment_version: "4"

      tasks:
        - task_key: etl_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.genie_tracing_etl.id}

        - task_key: detect_pii
          depends_on:
            - task_key: etl_pipeline
          environment_key: detections
          notebook_task:
            notebook_path: ../src/notebooks/02_detect_pii.py

        - task_key: detect_prompt_injection
          depends_on:
            - task_key: etl_pipeline
          environment_key: base
          notebook_task:
            notebook_path: ../src/notebooks/03_detect_prompt_injection.py

        - task_key: detect_guardrail_signals
          depends_on:
            - task_key: etl_pipeline
          environment_key: base
          notebook_task:
            notebook_path: ../src/notebooks/04_detect_guardrail_signals.py

        # ALL_DONE: one failed detector (e.g. a missing spaCy wheel) must not stop the session
        # rollup or the alert for what the other detectors found.
        - task_key: sessions_pipeline
          depends_on:
            - task_key: detect_pii
            - task_key: detect_prompt_injection
            - task_key: detect_guardrail_signals
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.genie_tracing_sessions.id}

        # The alert runs last so genie_sessions is fully rebuilt first, and only if that rebuild
        # succeeded (default run_if). Notifications go to the alert's own subscribers.
        - task_key: alert_sessions_to_review
          depends_on:
            - task_key: sessions_pipeline
          alert_task:
            alert_id: ${resources.alerts.genie_sessions_to_review.id}
            warehouse_id: ${var.warehouse_id}
